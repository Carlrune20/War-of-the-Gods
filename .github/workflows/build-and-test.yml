name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  # Lets a run be started by hand from the Actions tab, for when GitHub drops a push event.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up the workspace
        run: ./gradlew --stacktrace setupCIWorkspace

      - name: Check formatting
        run: |
          ./gradlew --stacktrace spotlessApply
          git diff --exit-code || { echo "::error::Formatting differs from spotless; diff above"; exit 1; }

      # Models edited in Blockbench (tools/models/blockbench/*.bbmodel) go into the jar as they were saved, so a
      # .bbmodel uploaded on its own is enough. Pillow and numpy draw the staff's and Silverlight's inventory icons,
      # and the glowing eyes are found again in the textures as imported.
      - name: Build models from their Blockbench files
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 tools/models/blockbench.py import
          python3 tools/textures/eyes.py

      - name: Build
        run: ./gradlew --stacktrace build

      - name: Boot a dedicated server and test /rts across restarts
        run: bash .github/scripts/server-smoke-test.sh

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            boot-*.log
            run/server/logs/
            run/server/crash-reports/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  # A .bbmodel uploaded on its own on a branch of this repository gets the mod's files built from it committed next to
  # it, so they are in the source once merged and a build without Python (gradlew on a checkout) has the edit too.
  sync-models:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Build models from their Blockbench files and commit them
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 tools/models/blockbench.py import
          git add src/main/resources/assets
          if git diff --cached --quiet; then
            echo "The models already match their Blockbench files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build the models from their Blockbench files"
          git push origin HEAD:${{ github.head_ref }}
